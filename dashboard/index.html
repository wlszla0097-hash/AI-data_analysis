<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>선택근무 장려금 관리판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="calendar.css">
<style>
/* 업무 화면: 기간·구분 → 근로자 목록(문제 근로자 빨간 테두리) → 클릭한 근로자의 월 출결 캘린더 → 단축 요일 선호 */
:root { --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif }
body { padding: 18px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)) }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 6px 20px }
header h1 { font-size: 1.5rem; letter-spacing: -.01em }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0 }
.bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap }
.seg button { font: inherit; font-size: 13.5px; border: 0; background: transparent; color: var(--ink2); padding: 6px 12px; cursor: pointer }
.seg button + button { border-left: 1px solid var(--line) }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600 }
.btn { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); border-radius: 7px; padding: 3px 10px; cursor: pointer }
button:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.lbl { font-size: 12px; color: var(--ink3); margin-right: 4px }
.rule { font-size: 12.5px; color: var(--ink2) }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px }
.card { text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 13px; cursor: pointer; display: grid; gap: 6px; min-width: 0 }
.card:hover { border-color: var(--ink3) }
.card.bad { border: 2px solid var(--bad); background: var(--bad-bg) }
.card.warn { border: 2px solid var(--warn-line) }
.card.sel { box-shadow: 0 0 0 3px var(--accent) }
.card .nm { display: flex; justify-content: space-between; gap: 6px; align-items: baseline }
.card .nm b { font-size: 15.5px }
.card .why { font-size: 12.5px; color: var(--ink2); line-height: 1.4; min-height: 1.4em }
.card.bad .why { color: var(--bad); font-weight: 600 }
.strip { display: flex; gap: 3px }
.strip span { flex: 1; height: 10px; border-radius: 3px; background: var(--good-bg); border: 1px solid var(--line) }
.strip .warn { background: var(--warn-line); border-color: var(--warn-line) }
.strip .bad { background: var(--bad); border-color: var(--bad) }
.strip .none { background: transparent; border-style: dashed }
.months { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px }
.months button { font: inherit; font-size: 12.5px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); cursor: pointer }
.months button.bad { border: 2px solid var(--bad); color: var(--bad); font-weight: 700; background: var(--bad-bg) }
.months button.warn { border: 2px solid var(--warn-line) }
.months button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink) }
.detail-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 4px }
.detail-head h2 { font-size: 20px }
details.guide-wrap summary { cursor: pointer; font-size: 13px; color: var(--ink2); margin: 2px 0 6px }
.guide { background: var(--surface2); border-radius: 8px; padding: 10px 12px; margin-bottom: 6px }
/* 단축 요일 선호 */
.pref { width: 100%; border-collapse: collapse; font-size: 13px }
.pref th, .pref td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle }
.pref th { font-size: 12px; color: var(--ink2); font-weight: 600 }
.pref td.num { text-align: right; font-variant-numeric: tabular-nums }
.stack { display: flex; height: 16px; border-radius: 4px; overflow: hidden; min-width: 120px; background: var(--surface2) }
.stack i { display: block; height: 100% }
.wkstrip { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; min-width: 150px }
.wkstrip i { height: 14px; border-radius: 2px; background: var(--surface2) }
.absent { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; align-items: end; height: 150px; margin-top: 8px }
.absent div { display: grid; gap: 4px; justify-items: center; align-self: end }
.absent .b { width: 70%; border-radius: 4px 4px 0 0 }
.absent .v { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums }
.grid2 { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr); gap: 16px }
.scroll { overflow-x: auto }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr } }
</style>

<div class="wrap">
  <header>
    <div>
      <div class="muted small" id="company"></div>
      <h1>선택근무 장려금 관리판</h1>
    </div>
    <div class="rule" id="rule"></div>
  </header>

  <div class="panel bar">
    <div><span class="lbl">구분</span><span class="seg" id="tabs"></span></div>
    <div><span class="lbl">기간</span><span class="seg" id="range"></span></div>
    <div class="small muted" id="summary"></div>
  </div>

  <section class="panel">
    <div class="detail-head"><h2 id="list-title" style="font-size:17px"></h2><span class="small muted" id="list-hint"></span></div>
    <div class="list" id="list"></div>
  </section>

  <section class="panel" id="detail"></section>

  <section class="panel" id="pref-sec">
    <div class="detail-head"><h2 style="font-size:17px">단축 요일 선호 — 인사·업무 배치 참고</h2><span class="small muted">선택한 기간에 실제로 단축한 날(8시간보다 1시간 이상 적게 일한 날) 기준</span></div>
    <div class="grid2">
      <div class="scroll"><table class="pref" id="pref"></table></div>
      <div>
        <div class="small"><b>요일별 오후 평균 부재 인원</b> <span class="muted">(그 요일 하루에 단축한 참여자 수 평균)</span></div>
        <div class="absent" id="absent"></div>
        <div class="small muted" id="absent-note" style="margin-top:8px"></div>
      </div>
    </div>
    <div class="legend" id="dow-legend"></div>
  </section>

  <p class="small muted" id="source"></p>
</div>

<script src="data.js"></script>
<script src="calendar.js"></script>
<script>
(function () {
  'use strict';
  var D = window.FLEX_DATA, FC = window.FC;
  var DOWC = ['var(--d0)', 'var(--d1)', 'var(--d2)', 'var(--d3)', 'var(--d4)'], DOWS = '월화수목금';
  var st = { tab: 'flex', range: 'all', sel: null, ym: null };
  try { var saved = JSON.parse(localStorage.getItem('flexboard') || '{}'); if (saved.tab) st.tab = saved.tab; if (saved.range) st.range = saved.range; } catch (e) {}
  function persist() { try { localStorage.setItem('flexboard', JSON.stringify({ tab: st.tab, range: st.range })); } catch (e) {} }
  var $ = function (id) { return document.getElementById(id); };
  var esc = FC.esc;

  var flexW = D.workers.filter(function (w) { return w.flex; }), regW = D.workers.filter(function (w) { return !w.flex; });
  var rounds = {};
  flexW.forEach(function (w) { Object.keys(w.months).forEach(function (ym) { var r = w.months[ym].round; if (r) (rounds[r] = rounds[r] || {})[ym] = 1; }); });
  function rangeMonths() {
    if (st.range === 'all') return D.months.slice();
    return Object.keys(rounds[st.range] || {}).sort();
  }

  $('company').textContent = D.company + ' · ' + D.months[0] + ' ~ ' + D.months[D.months.length - 1] + ' · 기준월 ' + D.ref;
  $('rule').textContent = D.rule.text;
  $('source').textContent = D.source + '. 계산은 판단 보조용이며 장려금 지급은 고용센터 심사, 근태·임금 처리는 회사가 결정합니다.';
  $('dow-legend').innerHTML = DOWS.split('').map(function (d, i) { return '<span><i style="background:' + DOWC[i] + ';border:0"></i>' + d + '요일</span>'; }).join('');

  function seg(el, opts, cur, on) {
    el.innerHTML = opts.map(function (o) { return '<button type="button" data-v="' + o[0] + '" aria-pressed="' + (String(o[0]) === String(cur)) + '">' + o[1] + '</button>'; }).join('');
    el.onclick = function (e) { var b = e.target.closest('button'); if (b) on(b.getAttribute('data-v')); };
  }

  // 근로자 한 명의 기간 상태
  function status(w, yms) {
    var bad = [], warn = [];
    yms.forEach(function (ym) { var mb = w.months[ym]; if (!mb) return; var c = FC.levelClass(w, mb); if (c === 'bad') bad.push(ym); else if (c === 'warn') warn.push(ym); });
    // 1년 보기에서 한두 달 누락 1회 같은 일은 노랑으로 띄우지 않는다: 노랑 = 조치 필요 달이 기간의 1/4 초과(1년 4개월 이상, 회차 1개월 이상)
    var need = Math.floor(yms.length / 4) + 1;
    var cls = bad.length ? 'bad' : warn.length >= need ? 'warn' : 'good', why;
    function mlist(a) { return a.map(function (x) { return (+x.slice(5)) + '월'; }).join('·'); }
    if (w.flex) {
      why = bad.length ? '미지급 ' + mlist(bad) + ' — ' + uniq(bad.map(function (x) { return w.months[x].fails; })).join(', ')
        : warn.length ? (cls === 'warn' ? '조치 필요 ' : '참고: ') + warn.length + '개월 — ' + topReasons(w, warn) : '이상 없음';
    } else {
      why = bad.length ? '확인 필요 ' + mlist(bad) + ' — ' + topReasons(w, bad.concat(warn)) : warn.length ? (cls === 'warn' ? '주의 ' : '참고: ') + warn.length + '개월 — ' + topReasons(w, warn) : '이상 없음';
    }
    return { cls: cls, bad: bad, warn: warn, why: why };
  }
  function uniq(a) { return a.filter(function (x, i) { return x && a.indexOf(x) === i; }); }
  function topReasons(w, yms) {
    var miss = 0, su = 0, bal = 0, uw = 0, late = 0;
    yms.forEach(function (ym) { var m = w.months[ym]; miss += m.miss; su += m.su; uw += m.uw; late += m.late; if (w.flex && m.bal < -1) bal++; });
    var r = [];
    if (miss) r.push('출결 누락 ' + miss + '회');
    if (bal) r.push('정산 부족 ' + bal + '개월');
    if (su) r.push('단축일 4시간 미달 ' + su + '일');
    if (!w.flex && uw) r.push('주 40시간 부족 ' + uw + '주');
    if (!w.flex && late >= 3) r.push('지각 ' + late + '회');
    return r.join(', ') || '확인 필요';
  }

  function render() {
    persist();
    var yms = rangeMonths(), ws = st.tab === 'flex' ? flexW : regW;
    seg($('tabs'), [['flex', '선택근무 참여자 ' + flexW.length + '명'], ['reg', '일반 근로자 ' + regW.length + '명']], st.tab, function (v) { st.tab = v; st.sel = null; st.ym = null; render(); });
    var ro = [['all', '1년 전체']].concat(Object.keys(rounds).sort().map(function (r) { var k = Object.keys(rounds[r]).sort(); return [r, r + '차 (' + (+k[0].slice(5)) + '~' + (+k[k.length - 1].slice(5)) + '월)']; }));
    seg($('range'), ro, st.range, function (v) { st.range = v; st.ym = null; render(); });

    var rows = ws.map(function (w) { return { w: w, s: status(w, yms) }; });
    var order = { bad: 0, warn: 1, good: 2 };
    rows.sort(function (a, b) { return order[a.s.cls] - order[b.s.cls] || (a.w.id < b.w.id ? -1 : 1); });
    var nb = rows.filter(function (r) { return r.s.cls === 'bad'; }).length, nw = rows.filter(function (r) { return r.s.cls === 'warn'; }).length;
    if (st.tab === 'flex') {
      var won = 0, lost = 0;
      flexW.forEach(function (w) { yms.forEach(function (ym) { var m = w.months[ym]; if (!m) return; if (m.pay) won += D.rule.amount; else lost += D.rule.amount; }); });
      $('summary').innerHTML = '이 기간 장려금 신청 예상 <b>' + won.toLocaleString() + '원</b>' + (lost ? ' · 미지급 <b style="color:var(--bad)">' + lost.toLocaleString() + '원</b>' : '');
    } else {
      $('summary').textContent = '일반 근로자는 근로기준법(1일 8시간·주 40시간) 기준 근태만 점검합니다.';
    }
    $('list-title').textContent = (st.tab === 'flex' ? '선택근무 참여자' : '일반 근로자') + ' — 빨강 ' + nb + '명 · 노랑 ' + nw + '명';
    $('list-hint').textContent = st.tab === 'flex' ? '빨강 = 장려금 미지급 달 있음 · 노랑 = 지급되지만 누락·부족·4시간 미달이 반복(1년 보기 4개월 이상 · 회차 보기 1개월 이상) · 카드를 누르면 월 캘린더' : '빨강 = 한 달에 누락 3회 이상·주 40시간 부족 2주 이상 · 노랑 = 누락·부족·지각이 반복(1년 보기 4개월 이상 · 회차 보기 1개월 이상) · 카드를 누르면 월 캘린더';
    $('list').innerHTML = rows.map(function (r) {
      var w = r.w, pref = w.pref ? '<span class="chip"><span class="dow-dot" style="background:' + DOWC[DOWS.indexOf(w.pref.top)] + '"></span>' + w.pref.top + ' 단축</span>' : '<span class="chip">' + esc(w.dept) + '</span>';
      var strip = yms.map(function (ym) { var m = w.months[ym]; return '<span class="' + (m ? FC.levelClass(w, m).replace('good', '') : 'none') + '" title="' + ym + (m ? ' ' + m.level : ' 기록 없음') + '"></span>'; }).join('');
      return '<button type="button" class="card ' + (r.s.cls === 'good' ? '' : r.s.cls) + (st.sel === w.id ? ' sel' : '') + '" data-id="' + w.id + '">' +
        '<div class="nm"><b>' + esc(FC.shortName(w.name)) + '</b>' + pref + '</div><div class="small muted">' + esc(w.dept) + (w.exit ? ' · ' + w.exit + ' 퇴사' : '') + '</div>' +
        '<div class="strip">' + strip + '</div><div class="why">' + esc(r.s.why) + '</div></button>';
    }).join('');
    $('list').onclick = function (e) { var b = e.target.closest('.card'); if (!b) return; st.sel = b.getAttribute('data-id'); st.ym = null; render(); document.getElementById('detail').scrollIntoView({ behavior: 'smooth', block: 'start' }); };

    if (!st.sel || !ws.some(function (w) { return w.id === st.sel; })) st.sel = rows[0].w.id;
    var w = D.workers.filter(function (x) { return x.id === st.sel; })[0], s = status(w, yms);
    var avail = yms.filter(function (ym) { return w.months[ym]; });
    if (!st.ym || avail.indexOf(st.ym) < 0) st.ym = (s.bad.length ? s.bad[s.bad.length - 1] : s.warn.length ? s.warn[s.warn.length - 1] : avail[avail.length - 1]);
    renderDetail(w, avail);
    $('pref-sec').style.display = st.tab === 'flex' ? '' : 'none';
    if (st.tab === 'flex') renderPref(yms);
  }

  function renderDetail(w, avail) {
    var el = $('detail');
    var mbtn = avail.map(function (ym) {
      var c = FC.levelClass(w, w.months[ym]);
      return '<button type="button" data-ym="' + ym + '" class="' + (c === 'good' ? '' : c) + '" aria-pressed="' + (ym === st.ym) + '">' + (+ym.slice(5)) + '월' + (c === 'bad' ? ' ×' : c === 'warn' ? ' !' : '') + '</button>';
    }).join('');
    var info = w.flex ? '선택근무 참여자 · 지원시작 ' + esc(w.start) + (w.pref ? ' · 주로 ' + w.pref.top + '요일 단축(' + Math.round(w.pref.share * 100) + '%)' : '') : '일반 근로자 · 9 to 6';
    el.innerHTML = '<div class="detail-head"><h2>' + esc(FC.shortName(w.name)) + '</h2><span class="muted small">' + esc(w.dept) + ' · ' + info + '</span></div>' +
      '<details class="guide-wrap"><summary>근로자에게 이 캘린더를 보여 줄 때 — 읽는 법</summary>' + FC.guideHTML(D, w) + '</details>' +
      '<div class="months" id="mbtn">' + mbtn + '</div>' + (st.ym ? FC.monthView(w, st.ym, { legend: true, copy: true }) : '<p class="muted">이 기간 기록 없음</p>');
    $('mbtn').onclick = function (e) { var b = e.target.closest('button'); if (b) { st.ym = b.getAttribute('data-ym'); renderDetail(w, avail); } };
    el.querySelectorAll('[data-copy]').forEach(function (b) {
      b.onclick = function () {
        var t = document.getElementById(b.getAttribute('data-copy')).textContent;
        function done() { b.textContent = '복사됨'; setTimeout(function () { b.textContent = '문안 복사'; }, 1500); }
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
        function fallback() { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) {} document.body.removeChild(ta); }
      };
    });
  }

  function isShort(c) { return c && c.s === '근무' && c.w != null && 480 - c.w >= D.rule.day_cut_h * 60; }
  function renderPref(yms) {
    var set = {}; yms.forEach(function (ym) { set[ym] = 1; });
    var mondays = {}, fridays = [0, 0, 0, 0, 0], dayCount = [{}, {}, {}, {}, {}], absent = [0, 0, 0, 0, 0];
    var rows = flexW.map(function (w) {
      var cnt = [0, 0, 0, 0, 0], weekly = {};
      Object.keys(w.days).forEach(function (iso) {
        if (!set[iso.slice(0, 7)]) return;
        var c = w.days[iso], dw = (new Date(iso + 'T00:00:00Z').getUTCDay() + 6) % 7;
        if (dw > 4) return;
        if (c.k !== 'hol') dayCount[dw][iso] = 1;
        var mon = new Date(iso + 'T00:00:00Z'); mon.setUTCDate(mon.getUTCDate() - dw); mon = mon.toISOString().slice(0, 10);
        mondays[mon] = 1;
        if (isShort(c)) { cnt[dw]++; absent[dw]++; weekly[mon] = dw; }
      });
      return { w: w, cnt: cnt, weekly: weekly };
    });
    var wl = Object.keys(mondays).sort();
    var h = '<thead><tr><th>근로자</th><th>요일 비중</th>' + DOWS.split('').map(function (d) { return '<th class="num">' + d + '</th>'; }).join('') + '<th>주로 쉬는 요일</th><th>주별 선택 (한 칸 = 1주)</th></tr></thead><tbody>';
    rows.forEach(function (r) {
      var tot = r.cnt.reduce(function (a, b) { return a + b; }, 0), top = r.cnt.indexOf(Math.max.apply(null, r.cnt));
      var stack = r.cnt.map(function (v, i) { return v ? '<i style="width:' + (v / tot * 100) + '%;background:' + DOWC[i] + '" title="' + DOWS[i] + ' ' + v + '일"></i>' : ''; }).join('');
      var strip = wl.map(function (m) { var v = r.weekly[m]; return '<i' + (v != null ? ' style="background:' + DOWC[v] + '"' : '') + ' title="' + m + ' 주' + (v != null ? ' ' + DOWS[v] + '요일' : ' 단축 없음') + '"></i>'; }).join('');
      h += '<tr><td><b>' + esc(FC.shortName(r.w.name)) + '</b><div class="tiny muted">' + esc(r.w.dept) + '</div></td><td><div class="stack">' + stack + '</div></td>' +
        r.cnt.map(function (v) { return '<td class="num">' + (v || '·') + '</td>'; }).join('') +
        '<td>' + (tot ? '<b>' + DOWS[top] + '요일</b> ' + Math.round(r.cnt[top] / tot * 100) + '%' : '-') + '</td><td><div class="wkstrip">' + strip + '</div></td></tr>';
    });
    $('pref').innerHTML = h + '</tbody>';
    var avg = absent.map(function (v, i) { var n = Object.keys(dayCount[i]).length; return n ? v / n : 0; });
    var mx = Math.max.apply(null, avg) || 1;
    $('absent').innerHTML = avg.map(function (v, i) { return '<div><span class="v">' + v.toFixed(1) + '명</span><span class="b" style="height:' + Math.max(2, v / mx * 110) + 'px;background:' + DOWC[i] + '"></span><span class="small">' + DOWS[i] + '</span></div>'; }).join('');
    var top = avg.indexOf(Math.max.apply(null, avg));
    $('absent-note').textContent = '참여자 ' + flexW.length + '명 중 ' + DOWS[top] + '요일 오후에 평균 ' + avg[top].toFixed(1) + '명이 빠집니다. 회의·고객 응대가 몰리는 요일이면 단축 요일을 나누도록 조정을 검토하세요.';
  }

  render();
})();
</script>
