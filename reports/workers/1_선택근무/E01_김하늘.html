<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>(가상)김하늘 출결 캘린더</title><style>/* 근로시간·선택근무 관리판 / 근로자 리포트 공용 스타일 */
:root{
  --bg:#fcfcfb; --surface:#ffffff; --surface2:#f4f4f1; --ink:#0b0b0b; --ink2:#52514e; --ink3:#8a8984; --line:#e6e5e0;
  --accent:#2a78d6; --good:#0ca30c; --good-bg:#eaf6ea; --warn:#b77900; --warn-line:#fab219; --warn-bg:#fff5dc;
  --bad:#d03b3b; --bad-bg:#fdecec; --short-bg:#e8f1fc; --short-line:#2a78d6; --leave-bg:#efeeea; --hol-bg:#f1f0ec;
  --d0:#2a78d6; --d1:#eb6834; --d2:#1baf7a; --d3:#eda100; --d4:#e87ba4;
  --radius:10px; --font:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --surface:#1b1b1a; --surface2:#242422; --ink:#f2f1ee; --ink2:#b9b8b3; --ink3:#86857f; --line:#34332f;
    --accent:#5b9ee8; --good:#3fc43f; --good-bg:#16301a; --warn:#f2c14e; --warn-line:#d79b12; --warn-bg:#352a10;
    --bad:#ef6a6a; --bad-bg:#3a1a1a; --short-bg:#172a42; --short-line:#5b9ee8; --leave-bg:#262624; --hol-bg:#20201e;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1b1b1a; --surface2:#242422; --ink:#f2f1ee; --ink2:#b9b8b3; --ink3:#86857f; --line:#34332f;
  --accent:#5b9ee8; --good:#3fc43f; --good-bg:#16301a; --warn:#f2c14e; --warn-line:#d79b12; --warn-bg:#352a10;
  --bad:#ef6a6a; --bad-bg:#3a1a1a; --short-bg:#172a42; --short-line:#5b9ee8; --leave-bg:#262624; --hol-bg:#20201e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.3}
.muted{color:var(--ink2)} .small{font-size:12px} .tiny{font-size:11px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.chip.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:600}
.chip.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn);font-weight:600}
.chip.good{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:600}
.dow-dot{width:10px;height:10px;border-radius:3px;display:inline-block}

/* 월 캘린더 */
.cal-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin:0 0 10px}
.cal-head h3{font-size:18px}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(118px,0.9fr);gap:6px}
.cal .hd{font-size:12px;color:var(--ink2);font-weight:600;padding:0 4px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 7px;min-height:96px;display:flex;flex-direction:column;gap:2px;position:relative}
.day .top{display:flex;justify-content:space-between;align-items:center;gap:4px}
.day .num{font-weight:700;font-size:13px}
.day .plan{font-size:11px;padding:0 6px;border-radius:999px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.day .plan.p-short{background:var(--short-bg);color:var(--accent);font-weight:600}
.day .plan.p-long{font-weight:600;color:var(--ink)}
.day .t{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.day .w{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.day .n{font-size:11.5px;line-height:1.35;color:var(--ink2)}
.day.k-short{background:var(--short-bg);border-color:var(--short-line)}
.day.k-warn{background:var(--warn-bg);border:2px solid var(--warn-line)}
.day.k-warn .n{color:var(--warn);font-weight:600}
.day.k-bad{background:var(--bad-bg);border:2px solid var(--bad)}
.day.k-bad .n{color:var(--bad);font-weight:700}
.day.k-leave{background:var(--leave-bg)}
.day.k-hol{background:var(--hol-bg);color:var(--ink3)}
.day.out{opacity:.38}
.day.out .n,.day.out .t{display:none}
.day.empty{background:transparent;border-style:dashed}
.wk{border-radius:8px;padding:6px 8px;border:1px solid var(--line);background:var(--surface2);font-size:12px;display:flex;flex-direction:column;gap:2px;justify-content:center;font-variant-numeric:tabular-nums}
.wk b{font-size:13px}
.wk.k-bad{background:var(--bad-bg);border:2px solid var(--bad);color:var(--bad)}
.wk.k-warn{background:var(--warn-bg);border:2px solid var(--warn-line)}
.wk .ref{font-size:10.5px;color:var(--ink3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);margin:8px 0 12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.legend .l-short{background:var(--short-bg);border-color:var(--short-line)}
.legend .l-warn{background:var(--warn-bg);border:2px solid var(--warn-line)}
.legend .l-bad{background:var(--bad-bg);border:2px solid var(--bad)}
.legend .l-leave{background:var(--leave-bg)}

/* 월 판정 */
.verdict{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;border-radius:var(--radius);padding:12px 14px;margin:14px 0 10px;border:1px solid var(--line);background:var(--surface)}
.verdict.bad{border:2px solid var(--bad);background:var(--bad-bg)}
.verdict.warn{border:2px solid var(--warn-line);background:var(--warn-bg)}
.verdict.good{border:2px solid var(--good);background:var(--good-bg)}
.verdict .big{font-size:17px;font-weight:800}
.verdict.bad .big{color:var(--bad)} .verdict.good .big{color:var(--good)} .verdict.warn .big{color:var(--warn)}
.verdict .kv{font-size:13px;color:var(--ink2)} .verdict .kv b{color:var(--ink);font-variant-numeric:tabular-nums}
.items{display:grid;gap:8px;margin:0 0 12px;padding:0;list-style:none}
.items li{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:9px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.items .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:var(--good)}
.items .k-bad .ic{background:var(--bad)} .items .k-warn .ic{background:var(--warn-line);color:#111} .items .k-info .ic{background:var(--ink3)}
.items .k-bad{border-color:var(--bad)}
.items .tt{font-weight:700}
.items .dd{font-size:12.5px;color:var(--ink2)}
.items .bb{font-size:11.5px;color:var(--ink3);margin-top:2px}
.msg{white-space:pre-wrap;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;margin:0}

@media (max-width:700px){
  .cal{grid-template-columns:1fr}
  .cal .hd{display:none}
  .day{min-height:0;display:grid;grid-template-columns:auto 1fr;column-gap:10px}
  .day .top{grid-column:1/-1}
  .day.out{display:none}
  .day.empty{display:none}
  .wk{margin-bottom:10px}
}
@media print{
  body{background:#fff}
  .day,.wk{break-inside:avoid}
}

<script>/* 월 출결 캘린더 렌더러 — 관리판(index.html)과 근로자별 리포트(reports/workers/*.html)가 같이 쓴다.

  function hm(min) {

  function weekHTML(wk, extra) {
    if (!wk) return '<div class="wk"></div>';
    return '<div class="wk k-' + wk.k + '"><span class="muted tiny">주 합계' + (wk.ref ? ' (참고)' : ' · 주 소정') + '</span>' +
      '<span>계획 <b>' + hmH(wk.plan) + '</b></span><span>실적 <b>' + hmH(wk.act) + '</b></span>' +
      '<span>' + esc(wk.n) + '</span>' + (extra ? '<span class="tiny">' + esc(extra) + '</span>' : '') +
      (wk.ref ? '<span class="ref">선택근무는 월 합계로 판정</span>' : '') + '</div>';
  }

  function calendarHTML(w, ym) {
    HOL = (g.FLEX_DATA && g.FLEX_DATA.holidays) || {};
    var first = ym + '-01', last = lastDay(ym), mon = mondayOf(first), h = '';
    for (var i = 0; i < 5; i++) h += '<div class="hd">' + DOWK[i] + '</div>';
    h += '<div class="hd">주 합계</div>';
    while (mon <= last) {
      for (var k = 0; k < 5; k++) {
        var iso = addDays(mon, k);
        h += dayHTML(iso, w.days[iso], iso.slice(0, 7) === ym);
      }
      var extra = [];
      [5, 6].forEach(function (k) { var iso = addDays(mon, k), c = w.days[iso]; if (c && c.w) extra.push(DOWK[k] + ' ' + hm(c.w) + ' 휴일근로'); });
      h += weekHTML(w.weeks[mon], extra.join(', '));
      mon = addDays(mon, 7);
    }
    return '<div class="cal">' + h + '</div>';
  }

  function verdictHTML(w, mb) {
    var cls, big;
    if (w.flex) {
      cls = mb.level === '미지급' ? 'bad' : mb.level === '조치 필요' ? 'warn' : 'good';
      big = mb.level === '미지급' ? '장려금 미지급 — ' + mb.fails : mb.level === '조치 필요' ? '장려금 지급 대상 · 확인할 것 있음' : '장려금 지급 대상 · 이상 없음';
      return '<div class="verdict ' + cls + '"><span class="big">' + esc(big) + '</span>' +
        '<span class="kv">단축 합계 <b>' + hmH(mb.cut) + '</b> / 기준 6:00</span>' +
        '<span class="kv">출결 누락 <b>' + mb.miss + '회</b> / 5회 이상 미지급</span>' +
        '<span class="kv">정산기간 소정 <b>' + hmH(mb.req) + '</b> · 실적 <b>' + hmH(mb.act) + '</b> · 과부족 <b>' + (mb.bal >= 0 ? '+' : '') + hmH(mb.bal) + '</b>' + (mb.miss ? ' (누락일 제외)' : '') + '</span>' +
        (mb.round ? '<span class="chip">' + mb.round + '차 신청분</span>' : '') + '</div>';
    }
    cls = mb.level === '확인 필요' ? 'bad' : mb.level === '주의' ? 'warn' : 'good';
    big = mb.level === '정상' ? '근태 정상' : '근태 ' + mb.level;
    return '<div class="verdict ' + cls + '"><span class="big">' + big + '</span>' +
      '<span class="kv">근무일 <b>' + mb.wd + '일</b> · 소정 <b>' + hmH(mb.req) + '</b> · 실적 <b>' + hmH(mb.act) + '</b></span>' +
      '<span class="kv">누락 <b>' + mb.miss + '</b> · 부족 주 <b>' + mb.uw + '</b> · 지각 <b>' + mb.late + '</b></span>' +
      (mb.ot > 0 ? '<span class="kv">연장 <b>' + hmH(mb.ot) + '</b></span>' : '') + '</div>';
  }

  function itemsHTML(mb) {
    var ic = { ok: '✓', warn: '!', bad: '×', info: 'i' };
    return '<ul class="items">' + mb.items.map(function (it) {
      return '<li class="k-' + it.k + '"><span class="ic">' + ic[it.k] + '</span><div><div class="tt">' + esc(it.t) + '</div><div class="dd">' + esc(it.d) +
        '</div><div class="bb">근거: ' + esc(it.b) + '</div></div></li>';
    }).join('') + '</ul>';
  }

  function legendHTML(flex) {
    return '<div class="legend"><span><i class="l-short"></i>단축일 정상' + (flex ? '' : '(해당 없음)') + '</span><span><i></i>계획대로 근무</span>' +
      '<span><i class="l-warn"></i>계획보다 적게 · 지각 · 사업주 보정</span><span><i class="l-bad"></i>출결 누락 · 단축일 4시간 미달</span>' +
      '<span><i class="l-leave"></i>연차 · 공휴일</span></div>';
  }

  function monthView(w, ym, opts) {
    opts = opts || {};
    var mb = w.months[ym];
    if (!mb) return '<p class="muted">' + ymLabel(ym) + ' 근무 기록 없음 (입사 전·퇴사 후)</p>';
    var id = 'msg-' + w.id + '-' + ym;
    return '<div class="month-wrap"><div class="cal-head"><h3>' + ymLabel(ym) + '</h3><span class="muted small">' + esc(shortName(w.name)) + ' · ' + esc(w.dept) + '</span></div>' +
      (opts.legend ? legendHTML(w.flex) : '') + calendarHTML(w, ym) + verdictHTML(w, mb) + itemsHTML(mb) +
      '<div class="cal-head" style="margin-top:4px"><b>근로자에게 보낼 안내</b>' +
      (opts.copy ? '<button class="btn" data-copy="' + id + '">문안 복사</button>' : '') + '</div><pre class="msg" id="' + id + '">' + esc(mb.msg) + '</pre></div>';
  }

  function levelClass(w, mb) {
    if (!mb) return '';
    if (w.flex) return mb.level === '미지급' ? 'bad' : mb.level === '조치 필요' ? 'warn' : 'good';
    return mb.level === '확인 필요' ? 'bad' : mb.level === '주의' ? 'warn' : 'good';
  }

  function guideHTML(data, w) {
    var sch = w.flex ? data.schedule['선택근무'] : data.schedule['일반'];
    var s = '<section class="guide"><h3 style="margin-bottom:6px">이 캘린더 읽는 법</h3><ul class="small" style="margin:0;padding-left:18px">' +
      '<li>내 근무계획: ' + esc(sch) + '</li>' +
      '<li>하루 칸: 그날 계획(장일·단축·통상), 출근–퇴근 시각, 실제 근무시간(휴게 뺀 시간), 문제가 있으면 무엇을 하면 되는지</li>' +
      '<li>오른쪽 \'주 합계\': 그 주 계획 시간과 실제 시간. ' + (w.flex ? '선택근무는 한 달 합계로 판단하므로 주 합계는 참고용입니다.' : '주 40시간(공휴일 있는 주는 근무일 × 8시간)을 채워야 합니다.') + '</li>' +
      (w.flex ? '<li>장려금: 한 달에 <b>단축 6시간 이상</b>(8시간보다 1시간 이상 적게 일한 날만, 단축일 하루 = 4시간 단축) + <b>출퇴근 기록 누락 5회 미만</b>이면 그 달 지급됩니다.</li>' : '') +
      '<li>출퇴근 버튼을 안 누르면 그날은 근무시간을 셀 수 없습니다. 빨간 칸이 보이면 정정 신청을 해 주세요.</li></ul></section>';
    return s;
  }

  function renderWorkerReport(el, data, id) {
    var w = data.workers.filter(function (x) { return x.id === id; })[0];
    var yms = data.months.filter(function (ym) { return w.months[ym]; });
    var strip = yms.map(function (ym) {
      var mb = w.months[ym], c = levelClass(w, mb);
      return '<a href="#m-' + ym + '" class="chip ' + c + '">' + (+ym.slice(5)) + '월 ' + (w.flex ? (mb.pay ? (mb.level === '정상' ? '○' : '△') : '×') : (mb.level === '정상' ? '○' : '!')) + '</a>';
    }).join(' ');
    var paid = yms.filter(function (ym) { return w.months[ym].pay; }).length;
    var h = '<header style="margin:6px 0 14px"><div class="muted small">' + esc(data.company) + ' · 출결 캘린더 리포트 · ' + esc(data.source) + '</div>' +
      '<h1 style="font-size:24px;margin:4px 0">' + esc(shortName(w.name)) + ' <span class="muted" style="font-size:15px">' + esc(w.dept) + ' · ' + (w.flex ? '선택근무 참여자(장려금 지원대상, ' + esc(w.start) + '~)' : '일반 근로자(9 to 6)') + '</span></h1>' +
      (w.flex ? '<p style="margin:4px 0">장려금 지급 예상 <b>' + paid + '/' + yms.length + '개월</b> · 선호 단축 요일 <b>' + esc(w.pref ? w.pref.top + '요일 ' + Math.round(w.pref.share * 100) + '%' : '-') + '</b></p>' : '') +
      '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">' + strip + '</div></header>' + guideHTML(data, w) + legendHTML(w.flex);
    h += yms.map(function (ym) { return '<section id="m-' + ym + '">' + monthView(w, ym, {}) + '</section>'; }).join('');
    el.innerHTML = h;
  }

  g.FC = { esc: esc, hm: hm, hmH: hmH, ymLabel: ymLabel, shortName: shortName, calendarHTML: calendarHTML, monthView: monthView, levelClass: levelClass, legendHTML: legendHTML, guideHTML: guideHTML, DOWK: DOWK };
  g.renderWorkerReport = renderWorkerReport;
})(window);
</script><script>renderWorkerReport(document.getElementById('app'), window.FLEX_DATA, 'E01');</script></body></html>
